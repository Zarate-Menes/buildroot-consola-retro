; Configuración base de Mednafen para la consola: video por softfb a pantalla
; completa, audio ALSA por HDMI y núcleo snes_faust para SNES.
video.driver softfb
video.fs 1
sound.driver alsa
sound.device sexyal-literal-default
sound.rate 48000
snes.enable 0
snes_faust.enable 1
